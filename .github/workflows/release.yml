name: Build Workflow

on:
  push:
    tags:
      - "v*.*.*"
      - "v*.*.*.alpha"
      - "v*.*.*-RC*"

jobs:
  build-windows:
    runs-on: windows-latest
    env:
      # Build the AI engine (llama.cpp) for a standard CPU, not for whatever the build
      # machine has: a "native" build crashed with an illegal instruction on other computers.
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v1

      - name: Create Version Text File for PyInstaller
        run: |
          # A test build (tag ending in -test...) carries the version it is a candidate for
          $tag = ('${{ github.ref }}' -replace 'refs/tags/', '') -replace '-test.*$', ''
          echo $tag > .\scripts\__version__
        shell: pwsh

      - name: Install Python
        # v5 downloads 3.10 when the runner image no longer has it pre-installed
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          architecture: "x64"

      # Create CUDA-enabled executable
      - name: Install CUDA-enabled llama_cpp
        run: |
          pip install --index-url https://abetlen.github.io/llama-cpp-python/whl/cu124 --extra-index-url https://pypi.org/simple llama-cpp-python==v0.3.8

      - name: Instal CUDA drivers for NVIDIA install
        run: |
          pip install nvidia-cudnn-cu12==9.5.0.50
          pip install nvidia-cuda-runtime-cu12==12.4.127
          pip install nvidia-cuda-nvrtc-cu12==12.4.127
          pip install nvidia-cublas-cu12==12.4.5.8

      - name: Install requirements
        run: |
          pip install -r client_requirements.txt -c constraints/windows.txt

      - name: Run PyInstaller for NVIDIA
        run: |
          pyinstaller --runtime-hook=.\scripts\runtime_hooks\hook-runtime.py --additional-hooks-dir=.\scripts\hooks --hidden-import=en_core_web_md --hidden-import=en_core_sci_md --add-data ".\scripts\NVIDIA_INSTALL.txt:install_state" --add-data ".\src\FreeScribe.client\whisper-assets:faster_whisper\assets" --add-data ".\src\FreeScribe.client\markdown:markdown" --add-data ".\src\FreeScribe.client\assets:assets" --add-data "C:\hostedtoolcache\windows\Python\3.10.11\x64\lib\site-packages\nvidia:nvidia-drivers" --name freescribe-client-nvidia --icon=.\src\FreeScribe.client\assets\logo.ico --noconsole .\src\FreeScribe.client\client.py

      # Create CPU-only executable
      - name: Uninstall CUDA-enabled llama_cpp (if necessary) and install CPU-only llama_cpp
        run: |
          pip uninstall -y nvidia-cudnn-cu12==9.5.0.50
          pip uninstall -y nvidia-cuda-runtime-cu12==12.4.127
          pip uninstall -y nvidia-cuda-nvrtc-cu12==12.4.127
          pip uninstall -y nvidia-cublas-cu12==12.4.5.8
          pip uninstall -y llama-cpp-python
          pip install --index-url https://abetlen.github.io/llama-cpp-python/whl/cpu --extra-index-url https://pypi.org/simple llama-cpp-python==v0.3.8

      - name: Run PyInstaller for CPU-only
        run: |
          pyinstaller --runtime-hook=.\scripts\runtime_hooks\hook-runtime.py --additional-hooks-dir=.\scripts\hooks --hidden-import=en_core_web_md --hidden-import=en_core_sci_md --add-data ".\scripts\CPU_INSTALL.txt:install_state" --add-data ".\src\FreeScribe.client\whisper-assets:faster_whisper\assets" --add-data ".\src\FreeScribe.client\markdown:markdown" --add-data ".\src\FreeScribe.client\assets:assets" --name freescribe-client-cpu --icon=.\src\FreeScribe.client\assets\logo.ico --noconsole .\src\FreeScribe.client\client.py

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $makensis = Join-Path ${env:ProgramFiles(x86)} 'NSIS\makensis.exe'
          $plugins = Join-Path $pwd 'scripts\nsis-plugins'
          $nsisArgs = @()
          foreach ($dir in Get-ChildItem $plugins -Directory) { $nsisArgs += "/X!addplugindir /$($dir.Name) `"$($dir.FullName)`"" }
          & $makensis @nsisArgs .\scripts\install.nsi
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rename Installer
        run: |
          mv dist/FreeScribeInstaller.exe dist/FreeScribeInstaller_windows.exe
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeScribeInstaller_windows.exe
          path: dist/FreeScribeInstaller_windows.exe

  
  build-macos-intel:
    runs-on: macos-15-intel   # macos-13 runners are retired
    env:
      # Build the AI engine (llama.cpp) for a standard CPU, not for whatever the build
      # machine has: a "native" build crashed with an illegal instruction on other computers.
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
      # python.org's Python is built for both chips; compile packages for Intel only
      ARCHFLAGS: "-arch x86_64"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python (python.org, with its own Tcl/Tk 8.6)
        # The runner's own Python 3.10 on Intel was built for Tk 8.5 but loads Homebrew's
        # Tk 8.6, so tkinter cannot open a window there; python.org's build brings a
        # matching Tk inside it.
        run: |
          curl -fsSL -o python.pkg https://www.python.org/ftp/python/3.10.11/python-3.10.11-macos11.pkg
          sudo installer -pkg python.pkg -target /
          /Library/Frameworks/Python.framework/Versions/3.10/bin/python3.10 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/python" -m pip install -q --upgrade pip
          echo "$RUNNER_TEMP/py/bin" >> "$GITHUB_PATH"

      - name: Check that tkinter works
        run: |
          which python
          python -c "import tkinter, sys; r = tkinter.Tk(); r.withdraw(); v = r.eval('info patchlevel'); print('Tk', v, r.eval('set tk_library')); r.destroy(); sys.exit(0 if v.startswith('8.6') else 1)"

      - name: Install PortAudio
        run: |
          brew install portaudio

      - name: Install requirements
        run: |
          pip install -r client_requirements_mac_x86.txt -c constraints/macos-x86_64.txt
      
      - name: Install ffmpeg
        run: |
          brew install ffmpeg

      - name: Build macOS app
        run: |
          ./build-mac.sh
      
      - name: Build PKG installer
        run: |
          ./build-pkg.sh --arch x86_64
        env:
          GITHUB_REF: ${{ github.ref }}

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeScribeInstaller_x86_64.pkg
          path: dist/FreeScribeInstaller_x86_64.pkg
  
  build-macos-arm:
    runs-on: macos-latest
    env:
      # Build the AI engine (llama.cpp) for a standard CPU, not for whatever the build
      # machine has: a "native" build crashed with an illegal instruction on other computers.
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PortAudio
        run: |
          brew install portaudio

      - name: Install requirements
        run: |
          pip install -r client_requirements_mac.txt -c constraints/macos-arm64.txt

      - name: Install ffmpeg
        run: |
          brew install ffmpeg

      - name: Build macOS app
        run: |
          ./build-mac.sh
      
      - name: Build PKG installer
        run: |
          ./build-pkg.sh --arch arm64
        env:
          GITHUB_REF: ${{ github.ref }}
      
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeScribeInstaller_arm64.pkg
          path: dist/FreeScribeInstaller_arm64.pkg

  build-linux:
    runs-on: ubuntu-22.04
    env:
      # Build the AI engine (llama.cpp) for a standard CPU, not for whatever the build
      # machine has: a "native" build crashed with an illegal instruction on other computers.
      CMAKE_ARGS: "-DGGML_NATIVE=OFF"
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Version Text File for PyInstaller
        run: |
          tag="${GITHUB_REF#refs/tags/}"; echo "${tag%%-test*}" > scripts/__version__

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install PortAudio and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev ffmpeg

      - name: Install CPU-only PyTorch
        run: |
          pip install torch==2.7.1 torchaudio==2.7.1 --index-url https://download.pytorch.org/whl/cpu

      - name: Install requirements
        run: |
          pip install -r client_requirements.txt -c constraints/linux.txt

      - name: Run PyInstaller
        run: |
          pyinstaller --runtime-hook=./scripts/runtime_hooks/hook-runtime.py --additional-hooks-dir=./scripts/hooks \
            --hidden-import=en_core_web_md --hidden-import=en_core_sci_md \
            --hidden-import=PIL._tkinter_finder --hidden-import=PIL.ImageTk \
            --add-data "./scripts/CPU_INSTALL.txt:install_state" \
            --add-data "./scripts/__version__:." \
            --add-data "./src/FreeScribe.client/whisper-assets:faster_whisper/assets" \
            --add-data "./src/FreeScribe.client/markdown:markdown" \
            --add-data "./src/FreeScribe.client/assets:assets" \
            --name FreeScribe --noconsole --noconfirm ./src/FreeScribe.client/client.py

      - name: Add launcher and package
        run: |
          cp scripts/linux/run-freescribe.sh scripts/linux/README.txt dist/FreeScribe/
          chmod +x dist/FreeScribe/run-freescribe.sh
          tar -czf dist/FreeScribe_linux_x86_64.tar.gz -C dist FreeScribe

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FreeScribe_linux_x86_64.tar.gz
          path: dist/FreeScribe_linux_x86_64.tar.gz

  create-release:
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos-intel, build-macos-arm, build-linux]
    permissions:
      contents: write
    steps:
      - name: Download Windows Installer
        uses: actions/download-artifact@v4
        with:
          name: FreeScribeInstaller_windows.exe

      - name: Download Intel Installer
        uses: actions/download-artifact@v4
        with:
          name: FreeScribeInstaller_x86_64.pkg

      - name: Download ARM Installer
        uses: actions/download-artifact@v4
        with:
          name: FreeScribeInstaller_arm64.pkg

      - name: Download Linux Build
        uses: actions/download-artifact@v4
        with:
          name: FreeScribe_linux_x86_64.tar.gz

      - name: Check if alpha or RC release
        id: check_alpha
        run: |
          if ("${{ github.ref }}" -like "*.alpha" -or "${{ github.ref }}" -like "*-RC*") {
            echo "is_alpha=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "is_alpha=false" >> $env:GITHUB_OUTPUT
          }
        shell: pwsh

      - name: Upload Installer
        id: upload-installer
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: Release ${{ github.ref_name }}
          tag_name: ${{ github.ref }}
          body: |
            ## What's Changed
            ${{ steps.changelog.outputs.CHANGELOG }}

            For full changelog, see [the commits since last release](${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.changelog.last_tag }}...${{ github.ref }})
          # Test builds (tags ending in -test...) stay drafts, visible only to the repo's
          # owners, until the installer test passes and they are published.
          draft: ${{ contains(github.ref_name, '-test') }}
          prerelease: ${{ steps.check_alpha.outputs.is_alpha == 'true' }}
          files: |
            FreeScribeInstaller_x86_64.pkg
            FreeScribeInstaller_arm64.pkg
            FreeScribeInstaller_windows.exe
            FreeScribe_linux_x86_64.tar.gz
